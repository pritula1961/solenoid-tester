name: Build EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyqt6 pyqtgraph pyserial

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name SolenoidTester --collect-all pyqtgraph --collect-all PyQt6 --hidden-import serial --hidden-import serial.tools.list_ports solenoid_tester.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SolenoidTester-Windows
        path: dist/SolenoidTester.exe
